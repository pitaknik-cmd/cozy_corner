<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการคำสั่งซื้อ — Room Scent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">

  <!-- สไตล์ตาราง (ใช้เฉพาะหน้านี้) -->
  <style>
    .table-wrap {
      overflow-x: auto;
      background: var(--c-white);
      border: var(--line);
    }
    .orders-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .orders-table th {
      text-align: left;
      font-weight: 400;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-taupe);
      padding: var(--s-4) var(--s-5);
      border-bottom: 1px solid var(--c-beige-dark);
      background: var(--c-cream);
      white-space: nowrap;
    }
    .orders-table td {
      padding: var(--s-4) var(--s-5);
      border-bottom: var(--line);
      color: var(--c-ink);
      vertical-align: top;
      white-space: pre-line;
    }
    .orders-table tbody tr:last-child td { border-bottom: 0; }
    .orders-table tbody tr:hover td { background: #faf7f2; }
    .orders-table td:first-child { white-space: nowrap; color: var(--c-ink-soft); }
    .orders-table td:nth-child(5),
    .orders-table th:nth-child(5) { text-align: right; white-space: nowrap; }
    .admin-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: var(--s-5);
    }
  </style>
</head>
<body>

  <!-- ========== Header ========== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Room<span>·</span>Scent</a>

      <button class="nav-toggle" type="button" aria-label="เปิดเมนู">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
        <a href="admin.html" class="is-active">คำสั่งซื้อ</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head">
          <span class="eyebrow">Admin</span>
          <h1>รายการคำสั่งซื้อ</h1>
          <hr class="divider">
          <p>เรียงจากคำสั่งซื้อล่าสุด ข้อมูลอาจใช้เวลาไม่กี่นาทีกว่าจะอัปเดตจาก Google Sheet</p>
        </div>

        <div class="admin-actions">
          <button type="button" class="btn btn--ghost btn--sm" onclick="location.reload()">รีเฟรชข้อมูล</button>
        </div>

        <div class="table-wrap">
          <table id="ordersTable" class="orders-table">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <!-- ========== Footer ========== -->
  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="logo">Room<span>·</span>Scent</a>
      <p>&copy; 2026 Room Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
